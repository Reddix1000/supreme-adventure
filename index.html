<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServerRack Demo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      .terminal {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: min(360px, calc(100vw - 32px));
        background: rgba(12, 16, 22, 0.9);
        border: 1px solid rgba(127, 227, 163, 0.35);
        border-radius: 10px;
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
        color: #dfe7ef;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        z-index: 10;
        backdrop-filter: blur(6px);
      }
      .terminal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(127, 227, 163, 0.2);
        background: rgba(18, 28, 34, 0.9);
      }
      .terminal-title {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7fe3a3;
      }
      .terminal-prompt {
        color: #7fe3a3;
      }
      .terminal-body {
        padding: 12px;
      }
      .terminal-line {
        color: #c7d2dc;
        margin-bottom: 6px;
      }
      .terminal-line strong {
        color: #7fe3a3;
      }
      .terminal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .terminal-button {
        appearance: none;
        border: 1px solid rgba(127, 227, 163, 0.4);
        background: rgba(20, 30, 36, 0.9);
        color: #e8f7ee;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      .terminal-button:hover {
        border-color: rgba(127, 227, 163, 0.8);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo/main.js"></script>
  </body>
</html>
